<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SubTrack - Subscription Manager</title>

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: Arial, sans-serif;
        }

        body {
            background: #f5f7fb;
            color: #222;
        }

        .app {
            display: flex;
            min-height: 100vh;
        }

        /* SIDEBAR */
        .sidebar {
            width: 240px;
            background: #17172f;
            color: white;
            padding: 30px 20px;
            position: fixed;
            height: 100vh;
        }

        .logo {
            font-size: 25px;
            font-weight: bold;
            margin-bottom: 45px;
            text-align: center;
        }

        .logo span {
            color: #8b5cf6;
        }

        .menu {
            list-style: none;
        }

        .menu li {
            padding: 15px;
            margin: 8px 0;
            border-radius: 10px;
            cursor: pointer;
        }

        .menu li:hover,
        .menu .active {
            background: #7c3aed;
        }

        /* MAIN */
        .main {
            margin-left: 240px;
            width: calc(100% - 240px);
            padding: 35px;
        }

        .top {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 30px;
        }

        .top h1 {
            font-size: 30px;
        }

        .top p {
            color: #777;
            margin-top: 5px;
        }

        .profile {
            background: white;
            padding: 10px 18px;
            border-radius: 30px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.05);
        }

        /* STAT CARDS */
        .stats {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 20px;
            margin-bottom: 30px;
        }

        .stat {
            padding: 25px;
            border-radius: 18px;
            color: white;
            min-height: 130px;
        }

        .purple {
            background: linear-gradient(135deg, #7c3aed, #a855f7);
        }

        .blue {
            background: linear-gradient(135deg, #2563eb, #38bdf8);
        }

        .pink {
            background: linear-gradient(135deg, #db2777, #f472b6);
        }

        .stat h3 {
            font-size: 15px;
            opacity: 0.9;
        }

        .stat h2 {
            font-size: 30px;
            margin-top: 15px;
        }

        /* CONTENT */
        .content {
            display: grid;
            grid-template-columns: 1fr 350px;
            gap: 25px;
        }

        .box {
            background: white;
            padding: 25px;
            border-radius: 18px;
            box-shadow: 0 5px 20px rgba(0,0,0,0.05);
        }

        .box-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
        }

        .box-header h2 {
            font-size: 21px;
        }

        /* SUBSCRIPTION */
        .subscription {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 17px;
            border: 1px solid #eee;
            border-radius: 14px;
            margin-bottom: 12px;
        }

        .sub-left {
            display: flex;
            align-items: center;
            gap: 15px;
        }

        .icon {
            width: 48px;
            height: 48px;
            border-radius: 12px;
            display: flex;
            justify-content: center;
            align-items: center;
            background: #ede9fe;
            font-size: 23px;
        }

        .sub-name {
            font-weight: bold;
        }

        .sub-date {
            color: #888;
            font-size: 13px;
            margin-top: 5px;
        }

        .price {
            font-weight: bold;
            color: #5b21b6;
        }

        .delete {
            border: none;
            background: #fee2e2;
            color: #dc2626;
            padding: 7px 10px;
            border-radius: 7px;
            cursor: pointer;
            margin-left: 10px;
        }

        /* FORM */
        .form-group {
            margin-bottom: 15px;
        }

        label {
            display: block;
            margin-bottom: 7px;
            font-size: 14px;
            font-weight: bold;
        }

        input {
            width: 100%;
            padding: 12px;
            border: 1px solid #ddd;
            border-radius: 9px;
            outline: none;
        }

        input:focus {
            border-color: #7c3aed;
        }

        .add-btn {
            width: 100%;
            padding: 13px;
            border: none;
            border-radius: 10px;
            background: #7c3aed;
            color: white;
            font-size: 16px;
            cursor: pointer;
            margin-top: 5px;
        }

        .add-btn:hover {
            background: #5b21b6;
        }

        /* EMPTY */
        .empty {
            text-align: center;
            color: #999;
            padding: 30px;
        }

        /* RESPONSIVE */
        @media(max-width: 900px) {
            .sidebar {
                width: 190px;
            }

            .main {
                margin-left: 190px;
                width: calc(100% - 190px);
            }

            .content {
                grid-template-columns: 1fr;
            }

            .stats {
                grid-template-columns: 1fr;
            }
        }

        @media(max-width: 600px) {
            .sidebar {
                display: none;
            }

            .main {
                margin-left: 0;
                width: 100%;
                padding: 20px;
            }
        }
    </style>
</head>

<body>

<div class="app">

    <!-- SIDEBAR -->
    <aside class="sidebar">

        <div class="logo">
            Sub<span>Track</span>
        </div>

        <ul class="menu">
            <li class="active">🏠 Dashboard</li>
            <li>💳 Subscriptions</li>
            <li>📅 Renewals</li>
            <li>📊 Expenses</li>
            <li>⚙️ Settings</li>
        </ul>

    </aside>


    <!-- MAIN CONTENT -->
    <main class="main">

        <!-- HEADER -->
        <div class="top">

            <div>
                <h1>Subscription Dashboard</h1>
                <p>Manage your subscriptions easily</p>
            </div>

            <div class="profile">
                👤 User
            </div>

        </div>


        <!-- STATISTICS -->
        <div class="stats">

            <div class="stat purple">
                <h3>Monthly Spending</h3>
                <h2>₹<span id="monthlyTotal">0</span></h2>
            </div>

            <div class="stat blue">
                <h3>Total Subscriptions</h3>
                <h2 id="totalSubs">0</h2>
            </div>

            <div class="stat pink">
                <h3>Upcoming Renewals</h3>
                <h2 id="renewals">0</h2>
            </div>

        </div>


        <!-- CONTENT -->
        <div class="content">

            <!-- SUBSCRIPTION LIST -->
            <div class="box">

                <div class="box-header">
                    <h2>My Subscriptions</h2>
                </div>

                <div id="subscriptionList">

                    <div class="empty">
                        No subscriptions added yet.
                    </div>

                </div>

            </div>


            <!-- ADD FORM -->
            <div class="box">

                <div class="box-header">
                    <h2>Add Subscription</h2>
                </div>

                <div class="form-group">
                    <label>Subscription Name</label>
                    <input
                        type="text"
                        id="name"
                        placeholder="Example: Netflix">
                </div>

                <div class="form-group">
                    <label>Monthly Price (₹)</label>
                    <input
                        type="number"
                        id="price"
                        placeholder="Example: 499">
                </div>

                <div class="form-group">
                    <label>Renewal Date</label>
                    <input
                        type="date"
                        id="date">
                </div>

                <button class="add-btn" onclick="addSubscription()">
                    + Add Subscription
                </button>

            </div>

        </div>

    </main>

</div>


<script>

    let subscriptions = [];


    function addSubscription() {

        let name = document.getElementById("name").value;
        let price = document.getElementById("price").value;
        let date = document.getElementById("date").value;

        if (name === "" || price === "" || date === "") {
            alert("Please fill all the details.");
            return;
        }

        subscriptions.push({
            name: name,
            price: Number(price),
            date: date
        });

        document.getElementById("name").value = "";
        document.getElementById("price").value = "";
        document.getElementById("date").value = "";

        displaySubscriptions();
    }


    function displaySubscriptions() {

        let list = document.getElementById("subscriptionList");

        list.innerHTML = "";

        let total = 0;

        subscriptions.forEach(function(sub, index) {

            total += sub.price;

            let icon = "📦";

            if (sub.name.toLowerCase().includes("netflix")) {
                icon = "🎬";
            }
            else if (sub.name.toLowerCase().includes("spotify")) {
                icon = "🎵";
            }
            else if (sub.name.toLowerCase().includes("amazon")) {
                icon = "🛒";
            }
            else if (sub.name.toLowerCase().includes("youtube")) {
                icon = "▶️";
            }

            list.innerHTML += `

                <div class="subscription">

                    <div class="sub-left">

                        <div class="icon">
                            ${icon}
                        </div>

                        <div>

                            <div class="sub-name">
                                ${sub.name}
                            </div>

                            <div class="sub-date">
                                Renewal: ${sub.date}
                            </div>

                        </div>

                    </div>

                    <div>

                        <span class="price">
                            ₹${sub.price}
                        </span>

                        <button
                            class="delete"
                            onclick="deleteSubscription(${index})">
                            Delete
                        </button>

                    </div>

                </div>
            `;
        });


        if (subscriptions.length === 0) {

            list.innerHTML = `
                <div class="empty">
                    No subscriptions added yet.
                </div>
            `;
        }


        document.getElementById("monthlyTotal").innerText = total;

        document.getElementById("totalSubs").innerText =
            subscriptions.length;

        document.getElementById("renewals").innerText =
            subscriptions.length;
    }


    function deleteSubscription(index) {

        subscriptions.splice(index, 1);

        displaySubscriptions();
    }

</script>

</body>
</html>
